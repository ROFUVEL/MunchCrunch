<!DOCTYPE html>
<html lang="ru">
<head>
  <title>MunchCrunch</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/style.css">
  <style>
    .header-title {
        flex-grow: 1;
        text-align: center;
        margin: 0;
        font-size: 24px;
    }
    .header-spacer {
        width: 140px; 
    }
    .center-actions {
        justify-content: center;
        gap: 20px;
    }
    .big-button {
        font-size: 20px;
        padding: 20px 32px;
        border-radius: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Добро пожаловать</h1>
    <div class="header-spacer"></div>
  </header>

  <main class="container">
    <div class="card center">
      <div class="actions center-actions">
        <button type="button" class="big-button" onclick="location.href='pages/login.html'">Войти в аккаунт</button>
        <button type="button" class="big-button" onclick="location.href='pages/menu.html'">Перейти в меню</button>
      </div>
    </div>
  </main>

</body>
</html>
