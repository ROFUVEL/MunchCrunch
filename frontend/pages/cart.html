<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Корзина - MunchCrunch</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .header-title {
        flex-grow: 1;
        text-align: center;
        margin: 0;
        font-size: 24px;
    }
    nav {
        display: flex;
        gap: 15px;
    }
    .cart-empty {
        text-align: center;
        padding: 40px;
        color: #666;
    }
    .checkout-btn {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        background: #222;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
    }
    .checkout-btn:hover {
        background: #444;
    }
    .total-section {
        text-align: right;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 2px solid #eee;
    }
  </style>
</head>
<body>

  <!-- Уведомления -->
  <div id="notice" class="notice notice--hidden"></div>

  <!-- Шапка -->
  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Корзина</h1>
    <nav>
      <a href="menu.html">Меню</a>
      <a href="cart.html" class="muted">Корзина</a>
      <a href="branches.html">Рестораны</a>
      <a href="profile.html">Профиль</a>
    </nav>
  </header>

  <!-- Основной контент -->
  <main class="container">
    <!-- Информация о выбранной точке -->
    <div id="selected-branch-info" class="card" style="margin-bottom: 20px;"></div>
    
    <!-- Список товаров в корзине -->
    <div id="cart"></div>
    
    <!-- Итого и кнопка оформления -->
    <div id="total"></div>
  </main>

  <!-- Подключение скриптов -->
  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/cart.js"></script>

</body>
</html>
