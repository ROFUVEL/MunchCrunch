<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Авторизация - MunchCrunch</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .header-title {
        flex-grow: 1;
        text-align: center;
        margin: 0;
        font-size: 24px;
    }
    .login-box {
        max-width: 400px;
        margin: 50px auto;
    }
    .big-input {
        padding: 13px !important;
        font-size: 16px;
    }
    .big-button {
        width: 100%;
        font-size: 26px;
        padding: 20px 32px;
        border-radius: 12px;
    }
  </style>
</head>
<body>

  <div id="notice" class="notice notice--hidden"></div>

  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Авторизация</h1>
  </header>

  <main class="container">
    <div class="card login-box center">
      <input type="text" id="phone" class="big-input" placeholder="Телефон" maxlength="11" 
             oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      <button type="button" id="login-btn" class="big-button">Войти</button>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/login.js"></script>

</body>
</html>
