<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Меню - MunchCrunch</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .header-title {
        flex-grow: 1;
        text-align: center;
        margin: 0;
        font-size: 24px;
    }
    nav {
        display: flex;
        gap: 15px;
    }
    
    /* Скролл-контейнер для категорий */
    .categories-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        overflow-x: auto;
        scroll-behavior: smooth;
        padding-bottom: 8px;
        
        /* Скрываем полосу прокрутки */
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar {
        display: none;
    }
    
    .category-btn {
        background: #e6e6e6;
        color: #222;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.2s;
        margin: 0;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .category-btn.active {
        background: #222;
        color: #fff;
    }
    .category-btn:hover {
        background: #d9d9d9;
    }
    .category-btn.active:hover {
        background: #444;
    }
    
    /* Карточки блюд */
    .card {
        transition: transform 0.2s;
    }
    .card:hover {
        transform: translateY(-2px);
    }
    
    .actions button {
        margin-right: 8px;
    }
    
    .muted {
        color: #666;
    }
  </style>
</head>
<body>

  <!-- Уведомления -->
  <div id="notice" class="notice notice--hidden"></div>

  <!-- Шапка -->
  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Меню</h1>
    <nav>
      <a href="menu.html" class="muted">Меню</a>
      <a href="cart.html">Корзина</a>
      <a href="branches.html">Рестораны</a>
      <a href="profile.html">Профиль</a>
    </nav>
  </header>

  <!-- Основной контент -->
  <main class="container">
    <!-- Кнопки категорий (динамически из БД) -->
    <div id="categories" class="categories-bar"></div>

    <!-- Список блюд -->
    <div id="menu"></div>
  </main>

  <!-- Подключение скриптов -->
  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/menu.js"></script>

</body>
</html>
