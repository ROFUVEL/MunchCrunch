<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../styles/style.css">
  <meta charset="UTF-8">
  <title>Управление меню</title>
  <style>
    .dish-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .dish-info {
      flex: 3;
    }
    .dish-actions {
      flex: 1;
      text-align: right;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .toggle-btn {
      background: #ff9800;
    }
    .toggle-btn:hover {
      background: #e68900;
    }
    .available {
      color: green;
      font-weight: bold;
    }
    .unavailable {
      color: red;
      font-weight: bold;
    }
    .price {
      color: #222;
      font-weight: bold;
      margin-top: 5px;
    }
    .category-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar {
      display: none;
    }
    .filter-btn {
      background: #e6e6e6;
      color: #222;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: #222;
      color: #fff;
    }
    .filter-btn:hover {
      background: #d9d9d9;
    }
  </style>
</head>
<body>
  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Управление меню</h1>
    <nav>
      <a href="staff.html">Заказы</a>
      <a href="manage-menu.html" class="muted">Меню</a>
      <a href="profile.html">Профиль</a>
    </nav>
  </header>

  <main class="container">
    <div class="actions" style="margin-bottom: 20px;">
      <button id="add-dish-btn" class="secondary">Добавить блюдо</button>
    </div>
    
    <!-- Фильтры -->
    <div id="filter-bar" class="category-bar"></div>
    
    <div id="menu-list"></div>
  </main>

  <!-- Модальное окно для добавления блюда -->
  <div id="add-dish-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.3); z-index:1000; width:400px;">
    <h3>Добавить блюдо</h3>
    <input id="dish-name" placeholder="Название" style="width:100%; margin-bottom:10px;">
    <input id="dish-description" placeholder="Описание" style="width:100%; margin-bottom:10px;">
    <input id="dish-price" type="number" placeholder="Цена" style="width:100%; margin-bottom:10px;">
    <select id="dish-category" style="width:100%; margin-bottom:10px;">
      <option value="">Выберите категорию</option>
    </select>
    <div class="actions">
      <button id="save-dish-btn">Сохранить</button>
      <button id="cancel-dish-btn" class="secondary">Отмена</button>
    </div>
  </div>
  <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;"></div>

  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/manage-menu.js"></script>
</body>
</html>
