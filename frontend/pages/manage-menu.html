<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../styles/style.css">
  <meta charset="UTF-8">
  <title>Управление меню</title>
  <style>
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .filter-btn {
      background: #e6e6e6;
      color: #222;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: #222;
      color: #fff;
    }
    .dish-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
    .dish-info {
      flex: 3;
    }
    .dish-actions {
      flex: 1;
      text-align: right;
    }
    .toggle-btn {
      background: #ff9800;
      padding: 8px 16px;
    }
    .available {
      color: green;
    }
    .unavailable {
      color: red;
    }
    .price {
      font-weight: bold;
      margin-top: 5px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      width: 400px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    .modal input, .modal select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .modal .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <div id="notice" class="notice notice--hidden"></div>

  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Управление меню</h1>
    <nav>
      <a href="staff.html">Заказы</a>
      <a href="manage-menu.html" class="muted">Меню</a>
      <a href="profile-staff.html">Профиль</a>
    </nav>
  </header>

  <main class="container">
    <div class="actions" style="margin-bottom: 20px;">
      <button id="add-dish-btn" class="secondary">+ Добавить блюдо</button>
    </div>
    
    <div id="filter-bar" class="filter-bar"></div>
    <div id="menu-list"></div>
  </main>

  <div id="add-dish-modal" class="modal">
    <h3>Новое блюдо</h3>
    <input type="text" id="dish-name" placeholder="Название блюда">
    <input type="text" id="dish-description" placeholder="Описание">
    <input type="number" id="dish-price" placeholder="Цена">
    <select id="dish-category">
      <option value="">Выберите категорию</option>
    </select>
    <div class="actions">
      <button id="save-dish-btn">Сохранить</button>
      <button id="cancel-dish-btn" class="secondary">Отмена</button>
    </div>
  </div>
  <div id="modal-overlay" class="modal-overlay"></div>

  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/manage-menu.js"></script>
</body>
</html>
