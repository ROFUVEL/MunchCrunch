<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Подтверждение - MunchCrunch</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

  <div id="notice" class="notice notice--hidden"></div>

  <header>
    <h1>MunchCrunch</h1>
    <h1 class="header-title">Подтверждение</h1>
  </header>

  <main class="container">
    <div class="card verify-box center">
      <h3>Введите код подтверждения</h3>
      <p class="muted">Код отправлен на номер <strong id="phone-display"></strong></p>
      
      <input type="text" id="code" class="code-input" placeholder="1234" maxlength="4" 
             oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      
      <div class="actions actions-spaced">
        <button id="verify-btn">Подтвердить</button>
        <button id="resend-btn" class="secondary">Отправить код повторно</button>
      </div>
      
      <div class="hint">
        <p class="muted">Для тестирования используйте код: <strong>1234</strong></p>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/verify.js"></script>

</body>
</html>
